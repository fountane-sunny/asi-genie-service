root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/asi-genie ./cmd/orchestrator"
  entrypoint = ["./tmp/asi-genie"]
  delay = 1000
  exclude_dir = ["tmp", "vendor", "docs", "specs"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "json", "yaml", "yml"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
